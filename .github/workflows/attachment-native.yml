name: Validate three native chat audio and science formulas installers and upgrades
on:
  push:
    branches: ['codex/audio-native-20261114-*']
    paths: ['attachment-batch.json', 'ci-attachment-native.py', 'native-report-smoke.py', 'ci_attachment_bridge.py', 'ci-fresh-install.py', 'ci-fresh-smoke.mjs', 'ci_repackage.py', 'ci_update_probe.py', 'ci-update-flow.cjs', 'ci-materials-ui.cjs', 'native-materials-fixture.py', '.github/workflows/attachment-native.yml']
permissions:
  contents: write
jobs:
  native:
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-x64
            runner: macos-15-intel
          - target: macos-arm64
            runner: macos-15
          - target: windows-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record native candidate run
        shell: bash
        env:
          KX_TARGET: ${{ matrix.target }}
        run: |
          python -c 'import json,os;open("native-run-"+os.environ["KX_TARGET"]+".json","w").write(json.dumps({"run_id":int(os.environ["GITHUB_RUN_ID"]),"workflow_commit":os.environ["GITHUB_SHA"]}))'
          tag=$(python -c 'import json;print(json.load(open("attachment-batch.json"))["tag"])')
          gh release upload "$tag" "native-run-${KX_TARGET}.json" --clobber
      - name: Prepare Windows packaging tool
        if: runner.os == 'Windows'
        run: choco install nsis --yes --no-progress
      - name: Verify fresh install, background indexing, bridge, and real update IPC
        run: python ci-fresh-install.py --target ${{ matrix.target }}
      - name: Retain native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attachments-${{ matrix.target }}
          path: fresh-evidence/${{ matrix.target }}/
          if-no-files-found: error
