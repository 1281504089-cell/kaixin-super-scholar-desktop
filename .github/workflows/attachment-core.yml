name: Build frozen chat audio and science formulas core
on:
  push:
    branches: ['codex/audio-core-20261114-*']
    paths: ['attachment-release.json', 'ci-attachment-core.py', 'student-chat-audio-20261114.patch', 'source-manifest.json', '.github/workflows/attachment-core.yml']
permissions:
  contents: write
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create isolated prerelease
        run: |
          set -euo pipefail
          tag=$(python -c 'import json;print(json.load(open("attachment-release.json"))["tag"])')
          if gh release view "$tag" --json isPrerelease > current.json 2>/dev/null; then
            python -c 'import json;assert json.load(open("current.json"))["isPrerelease"], "Never overwrite a final release"'
          else
            gh release create "$tag" --prerelease --target "$GITHUB_SHA" --title '聊天音频与理化公式候选 · 2026-11-14' --notes '正在验证聊天原生音频、选中文字朗读、理化公式及三端实际检查更新。验证完成后再设为正式版。'
          fi
      - name: Record candidate run
        run: |
          python -c 'import json,os;open("core-run.json","w").write(json.dumps({"run_id":int(os.environ["GITHUB_RUN_ID"]),"workflow_commit":os.environ["GITHUB_SHA"]}))'
          tag=$(python -c 'import json;print(json.load(open("attachment-release.json"))["tag"])')
          gh release upload "$tag" core-run.json --clobber
      - name: Build and verify core
        run: python ci-attachment-core.py
      - name: Keep core receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attachment-core
          path: attachment-core/attachment-core.json
          if-no-files-found: warn
