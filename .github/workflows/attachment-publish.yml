name: Publish native verified background materials and references batch
on:
  push:
    branches: ['codex/materials-publish-20261114-*']
    paths: ['attachment-publication.json', 'ci-promote-attachments.py', '.github/workflows/attachment-publish.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record publication run
        run: |
          python -c 'import json,os;open("publication-run.json","w").write(json.dumps({"run_id":int(os.environ["GITHUB_RUN_ID"]),"workflow_commit":os.environ["GITHUB_SHA"]}))'
          tag=$(python -c 'import json;print(json.load(open("attachment-publication.json"))["tag"])')
          gh release upload "$tag" publication-run.json --clobber
      - name: Verify three native proofs and switch signed batch
        run: python ci-promote-attachments.py
      - name: Keep publication receipts and previous defaults
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attachment-publication-receipt
          path: |
            PUBLICATION-RECEIPT.json
            publication-work/previous/
          if-no-files-found: warn
